<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elian's Chatbot</title>
  <link rel="stylesheet" href="./style.css?v=4" />
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
  <script defer src="./chat-bot.js?v=4"></script>
</head>
<body>
  <header class="site-header">
    <div>Columbia GSAPP</div>
    <div class="header-center">Computational Design Workflows<br><span>AI Chatbot</span></div>
    <div>Elian</div>
  </header>

  <main>
    <p class="eyebrow">2026</p>
    <h1>Elian's Chatbot</h1>
    <p class="subtitle">A GitHub Pages front end connected to a secure Firebase Function.</p>

    <section class="chat-card" aria-label="Chatbot">
      <div id="chat-messages" class="chat-messages" aria-live="polite"></div>

      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="message-input">Message</label>
        <input id="message-input" maxlength="1000" autocomplete="off" placeholder="Type your message…" />
        <button id="send-button" type="submit">Send</button>
      </form>

      <div class="status-row">
        <span id="chat-status">Ready</span>
        <span id="connection-status">Front end loaded</span>
      </div>
    </section>

    <p class="note">The webpage itself is static. AI replies require the Firebase function named <code>chat</code> to be deployed.</p>
  </main>
</body>
</html>
